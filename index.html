<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>503 Service Unavailable</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #000000;
      font-family: Arial, Helvetica, sans-serif;
    }

    .error {
      text-align: center;
      margin-top: 12vh;
      padding: 0 20px;
    }

    h1 {
      margin: 0 0 18px;
      font-size: 32px;
      font-weight: 500;
    }

    p {
      margin: 6px 0;
      font-size: 15px;
      line-height: 1.45;
    }

    hr {
      width: 38%;
      max-width: 420px;
      min-width: 220px;
      margin: 24px auto 14px;
      border: 0;
      border-top: 1px solid #bfbfbf;
    }

    .server {
      color: #555;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="error">
    <h1>503 Service Unavailable</h1>
    <p>The server is temporarily unable to service your request.</p>
    <p>Please try again later or contact the server administrator.</p>
    <hr>
    <div class="server">nginx</div>
  </div>
</body>
</html>
